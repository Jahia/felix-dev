# Build and publish the snapshot of the project that this Jahia fork branch maintains.
# The monorepo holds many projects, so only the project named by the branch is published.
name: On merge to a Jahia fork branch

on:
  push:
    branches:
      - '**-jahia'
    tags-ignore:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish the snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up the fork build
        id: setup
        uses: ./.github/actions/setup-fork-build
        with:
          branch: ${{ github.ref_name }}
          nexus_username: ${{ secrets.NEXUS_USERNAME }}
          nexus_password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Deploy with Maven
        shell: bash
        run: >-
          mvn -ntp -B -s .github/maven.settings.xml
          -f ${{ steps.setup.outputs.project-dir }}/pom.xml
          -Dmaven.javadoc.skip=true -Dgpg.skip=true
          deploy

      - name: Report where the artifact landed
        shell: bash
        run: |
          set -euo pipefail
          # actions/setup-java sets MAVEN_ARGS=-ntp, which hides every transfer line, so the
          # location is read from the project rather than from the Maven log.
          ev() {
            mvn -q -B -N -s .github/maven.settings.xml \
              -f '${{ steps.setup.outputs.project-dir }}/pom.xml' \
              help:evaluate -Dexpression="$1" -DforceStdout
          }
          version="$(ev project.version)"
          case "$version" in
            *-SNAPSHOT) repository="$(ev project.distributionManagement.snapshotRepository.url)" ;;
            *)          repository="$(ev project.distributionManagement.repository.url)" ;;
          esac
          group="$(ev project.groupId | tr '.' '/')"
          artifact="$(ev project.artifactId)"
          echo "::notice title=Snapshot published::${repository%/}/$group/$artifact/$version/"
